[workspace]
members = ["xtask"]

[package]
name = "hltv-demo"
version = "0.1.0"
edition = "2024"
description = "Find and download professional CS2 demo archives from hltv.org through a real browser"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hltv-demo"
path = "src/bin/hltv-demo.rs"

[[bin]]
name = "hltv-demo-mcp"
path = "src/bin/hltv-demo-mcp.rs"

[dependencies]
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
libc = "0.2.191"
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
rmcp = { version = "3.7.0", features = ["client", "server", "transport-io", "transport-child-process", "macros"] }
