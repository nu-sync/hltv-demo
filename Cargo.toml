[package]
name = "hltv-demo"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Find and download professional CS2 demo archives from hltv.org through a real Chrome"
repository = "https://github.com/nu-sync/hltv-demo"
readme = "README.md"
keywords = ["hltv", "cs2", "counter-strike", "demo", "mcp"]
categories = ["command-line-utilities"]
default-run = "hltv-demo"
publish = false

[workspace]
members = ["xtask"]

[dependencies]
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
libc = "0.2.191"
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
rmcp = { version = "3.7.0", features = ["client", "server", "transport-io", "transport-child-process", "macros"] }
