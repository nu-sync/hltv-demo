[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Development automation for hltv-demo: live checks, fixture capture, one-off MCP calls"

[dependencies]
hltv-demo = { path = ".." }
rmcp = { version = "3.7.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
regex = "1.13.1"
tempfile = "3.27.0"
